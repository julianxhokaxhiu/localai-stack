services:
  # /opt/lemonade/.config/flm/models doesn't exist in the lemonade image, so
  # Docker creates the lemonade-flm volume root-owned (0755) on first use.
  # The lemonade service runs as an unprivileged user (UID 10001, GID 999) and
  # can't write into it, causing "Permission denied" errors from FLM. Fix the
  # ownership here, as root, before the main service starts.
  lemonade-flm-init:
    image: ghcr.io/lemonade-sdk/lemonade-server:v11.5.2
    user: root
    entrypoint: ["sh", "-c", "mkdir -p /opt/lemonade/.config/flm/models && chown -R 10001:999 /opt/lemonade/.config/flm/models"]
    volumes:
      - lemonade-flm:/opt/lemonade/.config/flm/models

  lemonade:
    volumes:
      # Persist fastflow models
      - lemonade-flm:/opt/lemonade/.config/flm/models
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
    # /dev/accel/accel0 is owned by root:root on the host with group-read/write
    # permissions (mode 0660). The lemonade image runs as an unprivileged user
    # (UID 10001), so grant it supplementary access to GID 0 (root group) to
    # allow opening the device without requiring any changes on the host.
    group_add:
      - "0"
    depends_on:
      lemonade-flm-init:
        condition: service_completed_successfully

volumes:
  lemonade-flm:
