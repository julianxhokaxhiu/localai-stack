services:
  # /opt/lemonade/.config/flm/models doesn't exist in the lemonade image, so
  # Docker creates the lemonade-flm volume root-owned (0755) on first use.
  # The lemonade service runs as an unprivileged user (UID 10001, GID 999) and
  # can't write into it, causing "Permission denied" errors from FLM. Fix the
  # ownership here, as root, before the main service starts.
  lemonade-flm-init:
    image: ghcr.io/julianxhokaxhiu/lemonade-server:sha-ca61421e
    user: root
    entrypoint: ["sh", "-c", "mkdir -p /opt/lemonade/.config/flm/models && chown -R 10001:999 /opt/lemonade/.config/flm/models"]
    volumes:
      - lemonade-flm:/opt/lemonade/.config/flm/models

  lemonade:
    environment:
      # Leave empty to use the version bundled with the image.
      FLM_VERSION: "${FLM_VERSION:-}"
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        if [ -n "$$FLM_VERSION" ]; then
          case "$$FLM_VERSION" in
            v[0-9]*) ;;
            *) echo "FLM_VERSION must be a release tag starting with v and a digit" >&2; exit 1 ;;
          esac
          case "$$FLM_VERSION" in
            *[!a-zA-Z0-9._+-]*) echo "FLM_VERSION contains invalid characters" >&2; exit 1 ;;
          esac
          versions=/opt/lemonade/resources/backend_versions.json
          tmp="$$(mktemp "$${versions}.XXXXXX")"
          if ! awk -v version="$$FLM_VERSION" '
            /^  "flm": \{$$/ { in_flm = 1; blocks++ }
            in_flm && /^    "npu": "[^"]+"[,]?$$/ {
              sub(/"npu": "[^"]+"/, "\"npu\": \"" version "\"")
              matches++
            }
            in_flm && /^  \}[,]?$$/ { in_flm = 0 }
            { print }
            END {
              if (blocks != 1 || matches != 1 || in_flm) exit 1
            }
          ' "$$versions" > "$$tmp"; then
            rm -f "$$tmp"
            echo "Failed to update flm.npu in $$versions" >&2
            exit 1
          fi
          mv "$$tmp" "$$versions"
        fi
        exec "$$@"
      - --
    command: ["./lemond", "--host", "0.0.0.0"]
    volumes:
      # Persist fastflow models
      - lemonade-flm:/opt/lemonade/.config/flm/models
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
    # /dev/accel/accel0 is owned by root:root on the host with group-read/write
    # permissions (mode 0660). The lemonade image runs as an unprivileged user
    # (UID 10001), so grant it supplementary access to GID 0 (root group) to
    # allow opening the device without requiring any changes on the host.
    group_add:
      - "0"
    depends_on:
      lemonade-flm-init:
        condition: service_completed_successfully

volumes:
  lemonade-flm:
